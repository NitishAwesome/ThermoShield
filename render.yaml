services:
  - type: web
    name: thermoshield-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://thermo-shield-tau.vercel.app,http://localhost:5173,http://localhost:3000
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
